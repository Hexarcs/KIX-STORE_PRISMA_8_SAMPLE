{% extends 'base.html' %}

{% block content %}
<div class="banner">
    <h2>👤 Editar Perfil</h2>
</div>

<div style="max-width: 500px; margin: 20px auto; padding: 30px; background: var(--bg-inputs); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
    <form method="post">
        {% csrf_token %}
        
        {% for field in form %}
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
        {% endfor %}
        
        <button type="submit" class="btn-pay" style="width: 100%; padding: 12px; font-size: 16px; border: none; cursor: pointer;">
            💾 Salvar Alterações
        </button>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <a href="{% url 'home' %}" style="color: var(--texto-secundario); text-decoration: none; font-size: 14px;">
            ← Voltar para a loja
        </a>
    </div>
</div>
{% endblock %}
